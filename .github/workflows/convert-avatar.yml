name: Convert Avatar to PNG

on:
  push:
    branches: [main]
    paths:
      - "public/avatar.png"
      - ".github/workflows/convert-avatar.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert avatar to real PNG
        run: |
          file public/avatar.png
          convert public/avatar.png PNG32:public/avatar.png
          file public/avatar.png
      - name: Commit converted PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatar.png
          if git diff --cached --quiet; then
            echo "Avatar is already a real PNG"
          else
            git commit -m "Convert avatar to real PNG [skip ci]"
            git push
          fi
